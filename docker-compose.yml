version: '3.8'

volumes:
  n8n_data:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_n8n
    restart: always
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: n8n_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8n/n8n:latest
    container_name: n8n_automation
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - DB_TYPE=postgresdb
      - DB_POSTGRES_HOST=postgres
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_DATABASE=n8n_db
      - DB_POSTGRES_USER=n8n_user
      - DB_POSTGRES_PASSWORD=secure_password_here
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n